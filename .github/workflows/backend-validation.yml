name: Backend Validation

on:
pull_request:
branches:
- main

jobs:
validate:
name: Build and Test Backend
runs-on: ubuntu-latest

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    env:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: ${{ secrets.CI_SQL_PASSWORD }}
    ports:
      - 1433:1433
    options: >-
      --health-cmd "/opt/mssql-tools18/bin/sqlcmd
      -S localhost -U sa -P $${MSSQL_SA_PASSWORD}
      -C -Q 'SELECT 1'"
      --health-interval 10s
      --health-timeout 5s
      --health-retries 20
      --health-start-period 30s

env:
  SWEETSHOP_CONNECTION_STRING: >-
    Server=localhost,1433;
    Database=SweetShop;
    User Id=sa;
    Password=${{ secrets.CI_SQL_PASSWORD }};
    TrustServerCertificate=True;
    Encrypt=False;

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup .NET
    uses: actions/setup-dotnet@v4
    with:
      dotnet-version: 10.0.303

  - name: Restore dependencies
    run: dotnet restore SweetShop.slnx

  - name: Build solution
    run: dotnet build SweetShop.slnx --no-restore --configuration Release

  - name: Apply database migrations
    run: dotnet ef database update --project src/SweetShop.Infrastructure --startup-project src/SweetShop.Api

  - name: Run tests
    run: dotnet test SweetShop.slnx --no-build --configuration Release
